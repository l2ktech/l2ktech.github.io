name: Deploy protected portfolio entry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public entry contains no portfolio assets
        run: |
          test "$(find site -type f | wc -l)" -eq 3
          test -f site/.nojekyll
          cmp site/index.html site/wzy-portfolio/index.html
          grep -q 'location.replace(destination.href)' site/index.html
          ! grep -E 'const PROJECTS|media/|PORTFOLIO_ACCESS_PASSWORD|<iframe|<video|<img' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
